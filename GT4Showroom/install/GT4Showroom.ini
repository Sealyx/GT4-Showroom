; GT4 Showroom 2.2.0 - standalone Win32 ASI
; F1 opens. Right click opens the sidebar (never exits).
; Up adds a favorite; Down removes it; F switches Favorites / All Cars.
; Controller: View/Select opens, and opens the sidebar inside. Start pauses.
; D-pad/left stick browse; A confirms, B goes back, X adds, Y opens Favorites.
; Left-stick click opens model search with an on-screen keyboard.
; Start/Options opens native pause. Sidebar > Reload settings works with A/Cross.
; Native gamepad input and XInput can coexist. Keyboard/mouse remain available.
; Cinematic: click the CAR or Space/A toggles auto-spin; drag the car to orbit;
; wheel or LT/RT zooms; right stick orbits; Backspace/B returns to the catalogue.
[GT4Showroom]
; Diagnostic logging: 0 = off (default), 1 = on. GTSPAWN reloads it.
; Existing log files are preserved when disabled.
EnableLog=0
; Opening key: F1..F24, a letter/digit, INSERT/HOME/END/TAB, or Windows VK number.
; Examples: OpenKey=F2, OpenKey=G, OpenKey=112 (F1). Type GTSPAWN to reload all INI settings without restarting.
OpenKey=F1
; Default: spawn in front of CJ, with the vehicle side facing him.
; 1 = spawn and put CJ in the driver's seat.
SpawnInside=0
; Right-click Sort by: A-Z, Z-A, Class, Top Speed, Countries filter, Model ID.
; Countries lists only registered visible countries; All Countries clears the filter.
; Color confirmation opens native livery rectangles when available, including No Livery.
; Type GTSPAWN in gameplay or while the showroom is open to reload.
; Also reloads zoom, mouse/audio settings, exclusions and vehicles.ini.

; Sound=0 mutes all showroom audio.
Sound=1
; Volumes are independent, from 0 (mute) to 100 (full).
; Sound, both volumes and StudioZoom reload each time the showroom opens.
MusicVolume=45
EffectsVolume=80

; Main studio car only: 1.0 = original framing, >1 = closer.
; Values clamp to 0.65 .. 1.75. Bottom thumbnails keep their framing.
StudioZoom=1.15
; Mouse sensitivity multiplier, clamped to 0.25 .. 4.0. Reloaded on open.
MouseSensitivity=1.0

[ExcludedModels]
; Comma-separated decimal model IDs or model names, e.g. 400,peren,Yosemite.
; Clear the value to show all models. These exclusions affect only this showroom.
; Trailers, Trains, Planes, Helicopters and Boats are disabled by default.
; Add-on IDs and exact IDE model names are supported (case-insensitive).
ExcludedModels=435,450,584,591,606,607,608,610,611,449,537,538,569,570,590,460,464,476,511,512,513,519,520,539,553,577,592,593,417,425,447,465,469,487,488,497,501,548,563,430,446,452,453,454,472,473,484,493,595

[Countries]
; ADD-ON vehicles only. Vanilla IDs 400-611 always use their built-in donor origin.
; Comma-separated IDs or exact internal/display names; case-insensitive.
; Examples: USA=14556,890,barracuda / Japan=13200,12900,lucent
; ID assignments win over names. An unassigned add-on has a pure white badge.
; Vanilla entries and the obsolete Unknown key have no effect. GTSPAWN reloads.
USA=
Japan=
Italy=
France=
UK=
Germany=
Sweden=
China=
SouthKorea=
Canada=
Australia=
Russia=
Denmark=
Brazil=
Indonesia=
Malaysia=

[SecretUnlocks]
; REALBIG in model search randomly chooses one matching visible vehicle.
; Comma-separated decimal IDs or exact internal/display names, including add-ons.
; Clear Model to disable the command. Example tuner list: sultan,elegy,stratum,flash,jester
Model=calica
; 1 = apply installed compatible upgrades, including registered add-on modkits.
EnableModkit=1
; 1 = apply an installed paintjob independently of the modkit. 0 = original paint.
EnablePaintjob=0
; 1 = assign ONE random heavy-ramming or bullet/explosion-proof ability. 0 = neither.
EnableAbilities=1
; Reopen or type GTSPAWN outside model search to reload these settings.
