; Optional overrides keyed by the actual runtime vehicle model ID.
; No fixed catalog is read from this file: stock and add-on models are discovered.
; Values not supplied use the installed GXT name, live paint choices and handling.
; Names/brands/marketing paint names and HP/RPM/torque/RPM are not stored by GTA.
; Example only; remove the leading semicolon to enable each line.
; [405]
; Name=Sentinel
; Title=SENTINEL
; Brand=Your manufacturer
; Year='92
; Power=Your verified HP/RPM figure
; Torque=Your verified torque/RPM figure
; Information=Your complete verified specification line
; Paint1=Your manufacturer's paint name
