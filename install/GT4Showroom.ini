; GT4 Showroom 2.4.0

[GT4Showroom]
; Diagnostic logging: 0 = off (default), 1 = on.
EnableLog=0
; Examples: OpenKey=F2, OpenKey=G, OpenKey=112 (F1). Reload outside the showroom: type GTSPAWN, or hold L3 then Select/View.
OpenKey=F4
; Default: spawn in front of CJ, with the vehicle side facing him.
; 1 = spawn and put CJ in the driver's seat.
SpawnInside=1

