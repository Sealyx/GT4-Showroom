; GT4 Showroom 3.0

[GT4Showroom]
; Diagnostic logging: 0 = off (default), 1 = on
EnableLog=0
; Examples: OpenKey=F2, OpenKey=G, OpenKey=112 (F1). Reload outside the showroom: type GTSPAWN, or hold L3 then Select/View
OpenKey=F4
; 1 = spawn in front of CJ
; 2 = spawn with CJ already seated as driver
; 3 = play the animated entry and camera sequence
Spawn=2
; Music for the keyboard-accessed showroom only: 1, 2 or 3
Music=1
; Initial keyboard showroom style and background
Style=Default
Background=Default

[TutorialBox]
; 1 enables unseen tutorials; automatically becomes 0 after every topic has been shown
; Set back to 1 after completion to start a fresh tutorial cycle
Enabled=1
; Each topic: 0 = unseen, 1 = already displayed
Welcome=0
Cinematic=0
CustomizationIntro=0
Customization=0

