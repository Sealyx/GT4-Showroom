[SecretUnlocks]
; REALBIG in model search randomly chooses one matching visible vehicle.
; Comma-separated decimal IDs or exact internal/display names, including add-ons.
Model=sultan,stratum,uranus,flash,jester
; 1 = apply installed compatible upgrades, including registered add-on modkits.
EnableModkit=1
; 1 = apply an installed paintjob independently of the modkit. 0 = original paint.
EnablePaintjob=1
; 1 = assign ONE random heavy-ramming or bullet/explosion-proof ability. 0 = neither.
EnableAbilities=1
