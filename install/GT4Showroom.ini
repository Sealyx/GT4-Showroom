; GT4 Showroom 2.3.1

[GT4Showroom]
; Diagnostic logging: 0 = off (default), 1 = on. GTSPAWN reloads it.
; Existing log files are preserved when disabled.
EnableLog=0
; Opening key: F1..F24, a letter/digit, INSERT/HOME/END/TAB, or Windows VK number.
; Examples: OpenKey=F2, OpenKey=G, OpenKey=112 (F1). Type GTSPAWN to reload all INI settings without restarting.
OpenKey=F1
; Default: spawn in front of CJ, with the vehicle side facing him.
; 1 = spawn and put CJ in the driver's seat.
SpawnInside=0
; Sorting is controlled by the in-game right-click sidebar.
; Type GTSPAWN in gameplay or while the showroom is open to reload.
; Also reloads audio settings, exclusions and vehicles.ini.

; Sound=0 mutes all showroom audio.
Sound=1
; Volumes are independent, from 0 (mute) to 100 (full).
; Sound and both volumes reload each time the showroom opens.
MusicVolume=45
EffectsVolume=80

