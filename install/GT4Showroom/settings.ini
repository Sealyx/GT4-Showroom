; GT4 Showroom 3.0 - Showroom Settings

; Edit with the showroom closed, then reopen it or reload with GTSPAWN to apply changes
; Background names: Default, Static, Red, Dark Gray, Brushed Steel, Dark Graphite, Wooden Taupe, Aged Concrete, Weathered Slate, Horizontal Brushed, Cracked Plaster, Vertical Brushed, Midnight Slate, Smoky Steel & Blue Mist
; Industrial Garage is the Favorites initial preset and is not listed in the Background menu
; Recommended applies to Background. FloorReflections is 0/1; floor quality is Low, Medium, High or Ultra
; Country and class sections are independent. Combined sections use Countries.X.Classes.Y
; LastFilter decides which preset an untouched combination inherits
; Logos: 0=None, 1=Manufacturer, 2=Vehicle name, 3=Both. Style is shared
; Only predefined categories and contexts customized in-game are generated
; Country/class root floor settings describe their Background in Default style
; Prologue and other customized backgrounds use independent Presets.<name> sections
; Main root floor settings describe its current Style; a matching Presets section overrides them

[Main]
; Keyboard showroom style: Default or Prologue 
Style=Default
; Background for this context
; Recommended keeps its original or inherited default
Background=Recommended
; Music for the keyboard-accessed showroom only: 1, 2 or 3
Music=1
; Floor reflections for this preset only: 0=Off, 1=On
FloorReflections=1
; Saved floor reflection quality: Low, Medium, High, Ultra - retained while Off
ReflectionQuality=High
; Vehicle shadows for this preset only: On or Off
Shadows=On


[Settings]
; File format version - leave at 1
FormatVersion=1
; 0=None, 1=Manufacturer only, 2=Vehicle name only, 3=Both
Logos=0
; 1=Dealership logo replaces the manufacturer in dealerships only, 0=Normal rules
DealershipLogo=0
; Vehicle order: 1=Z-A, 2=A-Z, 3=Highest speed, 4=Country, 5=Model ID, 0=A-Z fallback
SortMode=5
; Last country filter: -1=All, 0=Unassigned, 1=USA, 2=Japan, 3=Italy, 4=France, 5=UK, 6=Germany, 7=Sweden, 8=China, 9=South Korea, 10=Canada, 11=Australia, 12=Russia, 13=Denmark, 14=Brazil, 15=Indonesia, 16=Malaysia
CountryFilter=-1
; Last class filter: -1=All, 0=Normal, 1=Poor, 2=Rich, 3=Executive, 4=Worker, 5=Heavy, 6=Taxi, 7=Mopeds, 8=Motorbikes, 9=Leisure boats, 10=Work boats, 11=Bicycles, 12=Special
ClassFilter=-1
; Multi-country filter bitmask - 0 uses CountryFilter; bit N selects country N above
CountryMask=0
; Multi-class filter bitmask - 0 uses ClassFilter; bit N selects class N above
ClassMask=0
; Country or Class - the last filter changed supplies an untouched combined preset
LastFilter=Class
; 0=Auto by country, 1=Metric, 2=Imperial
UnitFormat=0
; Shared edge smoothing quality: 0=Off, 1=Standard, 2=High, 3=Ultra
Antialiasing=3
; Shared ambient occlusion quality: 0=Off, 1=Standard, 2=High, 3=Ultra
AmbientOcclusion=3
; Shared vehicle reflection quality: Off, Low, Medium, High, Ultra 
; Independent of floor reflections
VehicleReflections=High
; Interface language: English, Indonesian, Spanish, Chinese, Japanese, Korean, Russian
; Unavailable packs fall back to English
Language=English
; 1=Show model IDs next to vehicle names, 0=Hide
DisplayModelId=0
; 1=Show internal model names next to vehicle names, 0=Hide
DisplayModelName=0

[Audio]
; Retained master volume (0-100) for compatibility
; Follows SA's SFX slider
Master=100
; Retained music volume (0-100) for compatibility
; Follows SA's Radio slider
Music=45
; Retained effects volume (0-100) for compatibility
; Follows SA's SFX slider
Effects=80

