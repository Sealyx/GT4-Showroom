; GT4 Showroom - Variants

; Sections identify the base model by its model name or numeric model ID
; The original vehicle is always available as the first choice
; Variant accepts a comma-separated list of additional model names or IDs, in selection order
; Listed variants are hidden from standalone browsing; global exclusions still apply
; Missing/unavailable models are skipped; no available variant means this stage is skipped

